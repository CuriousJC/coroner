name: Build and Release

on:
  push:
    tags: ["v*.*.*"]
  # The same build with nothing published, so a release can be rehearsed.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Makefile calls git describe for the version, which needs the
          # full history rather than the default shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # `make` builds the front end in web/ before compiling it in.
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: test
        run: go test ./...

      - name: build
        run: make release

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coroner-${{ github.sha }}
          path: |
            coroner
            coroner.exe

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            coroner coroner.exe
