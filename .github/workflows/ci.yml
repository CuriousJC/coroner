name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be started by hand. This is here because the automatic triggers
  # have silently failed to fire twice — once on a push to a PR branch, once on
  # the merge commit to main — and without this there is no way to kick CI
  # short of pushing another commit. The race detector only ever runs here, so
  # a missed trigger means nobody knows whether main is sound.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so there is no second version to keep in sync.
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # The race detector needs cgo, so it cannot run on a stock Windows dev
      # box. This is the only place it reliably executes, which makes it worth
      # having here rather than relying on anyone to run it locally.
      - name: test with the race detector
        run: go test -race ./...

      - name: build
        run: make all
