name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so there is no second version to keep in sync.
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      # The race detector needs cgo, so it cannot run on a stock Windows dev
      # box. This is the only place it reliably executes, which makes it worth
      # having here rather than relying on anyone to run it locally.
      - name: test with the race detector
        run: go test -race ./...

      - name: build
        run: make all
